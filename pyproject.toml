[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridshift"
version = "0.1.0"
description = "Schedule flexible home loads when the grid is cleanest and cheapest."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fuleinist" }]
keywords = ["carbon", "energy", "home-assistant", "demand-flex", "climate"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mqtt = ["paho-mqtt>=2.0"]

[project.scripts]
gridshift = "gridshift.cli:main"

[project.urls]
Homepage = "https://github.com/fuleinist/gridshift"
Issues = "https://github.com/fuleinist/gridshift/issues"

[tool.setuptools]
packages = ["gridshift", "gridshift.providers"]

[tool.setuptools.package-data]
gridshift = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"